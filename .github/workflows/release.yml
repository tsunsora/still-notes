name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check version matches release tag
        run: node -e "if(process.env.GITHUB_REF_NAME !== 'v'+require('./package.json').version) process.exit(1)"
      - run: npm test
      - name: Build installer and update metadata
        run: npm run installer
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = "../Still-Installer/Still-Notes-Setup-$version.exe"
          gh release create "$env:GITHUB_REF_NAME" "$installer" "${installer}.blockmap" "../Still-Installer/latest.yml" --verify-tag --draft --title "Still Notes $version" --notes-file RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false --latest
